server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing_event
    username: ticketing
    password: ticketing
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis