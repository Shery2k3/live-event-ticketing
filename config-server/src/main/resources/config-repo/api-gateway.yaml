server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/events/**
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

security:
  jwt:
    # HS256 secret. Must be at least 32 bytes. Override with JWT_SECRET in real environments.
    secret: ${JWT_SECRET:local-dev-secret-please-change-me-to-a-long-random-value-0123456789}
    expiration-minutes: 120
    issuer: live-event-ticketing
  users:
    - username: admin
      password: admin123
      role: ADMIN
    - username: user
      password: user123
      role: USER

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
