name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "feat/**" ]

jobs:
  compile-payment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile payment
        working-directory: payment
        run: mvn -B -ntp clean compile
