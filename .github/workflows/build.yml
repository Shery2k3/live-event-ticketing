name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "feat/**", main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - config-server
          - discovery-server
          - api-gateway
          - event
          - inventory
          - booking
          - payment
          - notification
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: mvn -B -ntp clean package -DskipTests
