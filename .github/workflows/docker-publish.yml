# Builds every service image and pushes it to Docker Hub.
# Requires two repository secrets:
#   DOCKERHUB_USERNAME - your Docker Hub username
#   DOCKERHUB_TOKEN    - a Docker Hub access token (Account Settings > Security)
name: docker-publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip on forks that do not have the Docker Hub secrets configured.
    if: github.repository == 'Shery2k3/live-event-ticketing'
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: config-server
            image: ticketing-config-server
          - module: discovery-server
            image: ticketing-discovery-server
          - module: api-gateway
            image: ticketing-api-gateway
          - module: event
            image: ticketing-event-service
          - module: inventory
            image: ticketing-inventory-service
          - module: booking
            image: ticketing-booking-service
          - module: payment
            image: ticketing-payment-service
          - module: notification
            image: ticketing-notification-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.module }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
